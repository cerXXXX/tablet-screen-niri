[package]
name = "encoder"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gstreamer-allocators = "0.25"
capture = { path = "../mbuf_capture" }

